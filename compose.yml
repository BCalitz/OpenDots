services:
  app:
    build:
      context: .
      target: app
    ports:
      - '127.0.0.1:4310:4310'
    environment:
      OWNER_TOKEN: ${OWNER_TOKEN:?Set a 24+ character OWNER_TOKEN in .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:4310}
      OWNER_ID: ${OWNER_ID:-opendots-owner}
      CPK_TELEMETRY_ID: ${CPK_TELEMETRY_ID:-}
      DO_NOT_TRACK: ${DO_NOT_TRACK:-0}
      COPILOTKIT_TELEMETRY_SAMPLE_RATE: ${COPILOTKIT_TELEMETRY_SAMPLE_RATE:-1}
      COPILOTKIT_TELEMETRY_DISABLED: ${COPILOTKIT_TELEMETRY_DISABLED:-false}
      VOICE_API_KEY: ${VOICE_API_KEY:-}
      VOICE_MODEL: ${VOICE_MODEL:-}
      VOICE_NAME: ${VOICE_NAME:-marin}
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
      DISCOVERY_MODEL: ${DISCOVERY_MODEL:-}
      DISCOVERY_BASE_URL: ${DISCOVERY_BASE_URL:-}
      DISCOVERY_API_KEY: ${DISCOVERY_API_KEY:-}
      DISCOVERY_THRESHOLD: ${DISCOVERY_THRESHOLD:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      SLACK_TEAM_ID: ${SLACK_TEAM_ID:-}
      SLACK_USER_IDS: ${SLACK_USER_IDS:-}
      SLACK_DOT_ID: ${SLACK_DOT_ID:-}
      AGENT_RUN_TIMEOUT_MS: ${AGENT_RUN_TIMEOUT_MS:-90000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-parallel}
      PARALLEL_API_KEY: ${PARALLEL_API_KEY:-}
      BROWSER_URL: http://browser:4311
      BROWSER_SECRET: ${BROWSER_SECRET:-}
      DATABASE_URL: postgres://opendots:${POSTGRES_PASSWORD:-opendots}@postgres:5432/opendots
    # /data holds the SQLite file of releases before Postgres, for
    # `npm run import-sqlite`; see docs/SETUP.md#moving-from-sqlite.
    volumes:
      - opendots-data:/data
    # Lets the app reach a model server on this machine, such as Ollama, at
    # http://host.docker.internal:11434/v1 (built into Docker Desktop).
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - browser-link
      - app-egress
      - database
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  # Everything OpenDots stores. pgvector adds the vector extension; the
  # schema also enables pg_trgm. `npm run db` starts only this service for
  # `npm run dev`.
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: opendots
      POSTGRES_DB: opendots
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opendots}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - opendots-postgres:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U opendots -d opendots']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    shm_size: 128mb
    security_opt:
      - no-new-privileges:true
  # A throwaway server for `npm test`, started with `npm run test:db`. Its
  # data lives in memory and each test uses its own schema.
  postgres-test:
    profiles: [test]
    image: pgvector/pgvector:0.8.7-pg17
    command:
      [
        'postgres',
        '-c',
        'max_connections=400',
        '-c',
        'fsync=off',
        '-c',
        'synchronous_commit=off',
        '-c',
        'full_page_writes=off',
      ]
    environment:
      POSTGRES_USER: opendots
      POSTGRES_DB: opendots_test
      POSTGRES_PASSWORD: opendots
    ports:
      - '127.0.0.1:54329:5432'
    tmpfs:
      - /var/lib/postgresql/data
    shm_size: 128mb
  browser:
    profiles: [browser]
    build:
      context: .
      target: browser
    environment:
      BROWSER_SECRET: ${BROWSER_SECRET:-}
    networks:
      - browser-link
      - browser-egress
    init: true
    restart: unless-stopped
    shm_size: 256mb
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  # Public HTTPS on your own domain without opening ports: a Cloudflare
  # Tunnel. Start with `docker compose --profile tunnel up -d`; see
  # docs/SETUP.md#cloudflare-tunnel.
  tunnel:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.10.7
    command: ['tunnel', '--no-autoupdate', 'run']
    environment:
      # Not marked required: Compose would then insist on it even when the
      # tunnel profile is off.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - app
    networks:
      - app-egress
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
networks:
  browser-link:
    internal: true
  app-egress:
  browser-egress:
  database:
volumes:
  opendots-data:
  opendots-postgres:
