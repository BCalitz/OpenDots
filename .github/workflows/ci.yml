name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: opendots
          POSTGRES_PASSWORD: opendots
          POSTGRES_DB: opendots_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U opendots -d opendots_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://opendots:opendots@127.0.0.1:54329/opendots_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Knip (report only)
        run: npm run knip -- --no-exit-code --reporter symbols --reporter github-actions
      - name: Knip production (report only)
        run: npm run knip:production -- --no-exit-code --reporter symbols --reporter github-actions
      - run: npm run check-format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
